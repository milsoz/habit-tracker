<section>
  <div class="menu">
    <div class="controls">
      <div class="buttons" role="tablist" aria-label="Habit tracking categories">
        <button
          class="tab-btn {{ data.selectedMenuIndex() === 1 ? 'active' : '' }}"
          (click)="data.setIndex(1)"
          role="tab"
          [attr.aria-selected]="data.selectedMenuIndex() === 1"
          [attr.aria-controls]="'tabpanel-body'"
          id="tab-body"
        >
          <span class="{{ data.selectedMenuIndex() === 1 ? ' highlight highlight-1' : '' }}"
            >Body</span
          >
        </button>
        <button
          class="tab-btn {{ data.selectedMenuIndex() === 2 ? 'active' : '' }}"
          (click)="data.setIndex(2)"
          role="tab"
          [attr.aria-selected]="data.selectedMenuIndex() === 2"
          [attr.aria-controls]="'tabpanel-mind'"
          id="tab-mind"
        >
          <span class="{{ data.selectedMenuIndex() === 2 ? 'highlight highlight-2' : '' }}"
            >Mind</span
          >
        </button>
        <button
          class="tab-btn {{ data.selectedMenuIndex() === 3 ? 'active' : '' }}"
          (click)="data.setIndex(3)"
          role="tab"
          [attr.aria-selected]="data.selectedMenuIndex() === 3"
          [attr.aria-controls]="'tabpanel-goals'"
          id="tab-goals"
        >
          <span class="{{ data.selectedMenuIndex() === 3 ? ' highlight highlight-3' : '' }}"
            >Goals</span
          >
        </button>
      </div>
      <p-datepicker
        [(ngModel)]="data.dateValue"
        (onSelect)="data.loadDataForDate($event)"
        [showIcon]="true"
        inputId="buttondisplay"
        [showOnFocus]="true"
      ></p-datepicker>
    </div>

    <div class="tab">
      @if(data.selectedMenuIndex() === 1) {
      <div role="tabpanel" id="tabpanel-body" [attr.aria-labelledby]="'tab-body'">
        <app-body />
      </div>
      } @if(data.selectedMenuIndex() === 2) {
      <div role="tabpanel" id="tabpanel-mind" [attr.aria-labelledby]="'tab-mind'">
        <app-mind />
      </div>
      } @if(data.selectedMenuIndex() === 3) {
      <div role="tabpanel" id="tabpanel-goals" [attr.aria-labelledby]="'tab-goals'">
        <app-goals />
      </div>
      }
    </div>
  </div>
</section>
